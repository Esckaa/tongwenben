<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>同文本检索 · 设置</title>
<link rel="stylesheet" href="src/options.css">
</head>
<body>
<main>
  <h1>同文本检索 · 设置</h1>

  <label class="row">
    <input type="checkbox" id="fallback">
    <span>
      <b>近似兜底</b>
      <small>完全一致一处都没有时，按关键词覆盖找最相近的 3 段，并标注相似度。</small>
    </span>
  </label>

  <label class="row">
    <input type="checkbox" id="groupByHeading">
    <span>
      <b>按标题分组</b>
      <small>结果按最近的 h1–h6 标题分段显示，长文里更好找。</small>
    </span>
  </label>

  <label class="row">
    <span>
      <b>最多显示</b>
      <small>超出部分只计数，不逐条列出。</small>
    </span>
    <select id="maxShow">
      <option value="50">50 条</option>
      <option value="100">100 条</option>
      <option value="200">200 条</option>
    </select>
  </label>

  <div class="row color-row">
    <span>
      <b>高亮色系</b>
      <small>浅色标出全部命中；鼠标悬停或点击列表项时变深色。深色和浅色由同一色系决定。</small>
    </span>
  </div>
  <div id="palette" class="palette" role="radiogroup" aria-label="高亮色系"></div>
  <p class="preview">
    效果预览：这里是普通文字，<mark id="previewMark">这段是命中</mark>，鼠标移上去会变深。
  </p>

  <div class="row">
    <span>
      <b>PDF 阅读器</b>
      <small>在扩展内打开 PDF，选中文字同样可以检索。</small>
    </span>
    <button id="openPdf" class="open-pdf" type="button">打开</button>
  </div>

  <p id="status" class="status" role="status"></p>
</main>
<script src="src/theme.js"></script>
<script src="src/options.js"></script>
</body>
</html>
