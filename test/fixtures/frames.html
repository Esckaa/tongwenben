<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Iframe 测试 · 顶层</title>
<style>
  body {
    margin: 24px;
    max-width: 900px;
    font: 15px/1.8 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #222;
  }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .hint {
    background: #fff8e1;
    border: 1px solid #f0e0a8;
    border-radius: 8px;
    padding: 12px 14px;
    margin: 0 0 18px;
    font-size: 14px;
  }
  iframe {
    width: 640px;
    max-width: 100%;
    height: 240px;
    border: 1px solid #d8d3c8;
    border-radius: 8px;
    background: #fff;
  }
  .status {
    margin: 14px 0 0;
    font: 13px/1.6 system-ui, sans-serif;
    color: #666;
  }
  .status.good { color: #2e7d32; }
  .status.bad { color: #b00020; }
</style>
</head>
<body>
<h1>同源 iframe 测试</h1>

<div class="hint">
  1. 在下方 iframe 里选中<b>加粗的两个词</b>（iframe + needle），不要只选 iframe；<br>
  2. 面板应显示 3 处：顶层 1 处 + iframe 里 2 处；<br>
  3. 点 iframe 里的条目，应滚到 iframe 内对应位置。
</div>

<p>Top level: iframe needle once, outside the frame.</p>

<iframe id="frame" src="frame-src.html" title="子页面"></iframe>

<p id="sts-status" class="status">扩展状态：检查中…</p>

<script>
  setTimeout(function () {
    var el = document.getElementById('sts-status');
    var version = document.documentElement.getAttribute('data-sts-version');
    var frame = document.getElementById('frame');
    var frameVersion = null;

    try {
      frameVersion = frame.contentDocument.documentElement.getAttribute('data-sts-version');
    } catch (err) {
      // 跨域或未加载
    }

    if (!version) {
      el.textContent = '扩展未注入：确认已重载扩展、页面已刷新；本地文件还要开启「允许访问文件网址」。';
      el.className = 'status bad';
    } else {
      el.textContent = '扩展已注入：v' + version + '；iframe 已接管：' + (frameVersion ? '是' : '否');
      el.className = frameVersion ? 'status good' : 'status bad';
    }
  }, 1500);
</script>

</body>
</html>
